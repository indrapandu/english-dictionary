<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#315c4f">
    <meta name="description" content="A personal English dictionary for learning vocabulary.">
    <title>My Dictionary</title>
    <link rel="stylesheet" href="css/style.css?v=20260913-2">
</head>
<body class="app-page">
    <noscript>This application requires JavaScript.</noscript>

    <div class="app-shell">
        <aside class="sidebar" aria-label="Dictionary navigation">
            <a class="brand" href="index.html" aria-label="My Dictionary home">
                <span class="brand-mark">M</span>
                <strong>My Dictionary</strong>
            </a>

            <nav class="filter-nav" aria-label="Word filters">
                <button class="nav-item active" type="button" data-filter="all">
                    <span>All words</span><span class="nav-count" id="countAll">0</span>
                </button>
                <button class="nav-item" type="button" data-filter="favorite">
                    <span>Favorites</span><span class="nav-count" id="countFavorite">0</span>
                </button>
                <button class="nav-item" type="button" data-filter="New">
                    <span>New</span><span class="nav-count" id="countNew">0</span>
                </button>
                <button class="nav-item" type="button" data-filter="Learning">
                    <span>Learning</span><span class="nav-count" id="countLearning">0</span>
                </button>
                <button class="nav-item" type="button" data-filter="Familiar">
                    <span>Familiar</span><span class="nav-count" id="countFamiliar">0</span>
                </button>
                <button class="nav-item" type="button" data-filter="Mastered">
                    <span>Mastered</span><span class="nav-count" id="countMastered">0</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <span class="user-pill" id="userEmail"></span>
                <button class="text-button" id="logoutButton" type="button">Log out</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="mobile-header">
                <a class="brand" href="index.html">
                    <span class="brand-mark">M</span>
                    <strong>My Dictionary</strong>
                </a>
                <button class="text-button" id="mobileLogoutButton" type="button">Log out</button>
            </header>

            <section class="page-heading">
                <h1>Words</h1>
                <button class="primary-button" id="addWordButton" type="button" disabled>
                    <span aria-hidden="true">+</span> Add word
                </button>
            </section>

            <section class="toolbar" aria-label="Search and mobile filters">
                <label class="search-box">
                    <span class="visually-hidden">Search vocabulary</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
                    <input id="searchInput" type="search" placeholder="Search words or meanings" autocomplete="off">
                </label>
                <label class="mobile-filter">
                    <span class="visually-hidden">Filter words</span>
                    <select id="mobileFilterSelect">
                        <option value="all">All words</option>
                        <option value="favorite">Favorites</option>
                        <option value="New">New</option>
                        <option value="Learning">Learning</option>
                        <option value="Familiar">Familiar</option>
                        <option value="Mastered">Mastered</option>
                    </select>
                </label>
            </section>

            <section class="dictionary-layout" id="dictionaryLayout">
                <div class="word-list-panel">
                    <div class="panel-heading">
                        <h2 id="listTitle">All words</h2>
                        <span id="resultCount">0 words</span>
                    </div>
                    <div class="word-list" id="wordList" aria-live="polite"></div>
                </div>

                <aside class="word-detail" id="wordDetail" aria-live="polite">
                    <div class="empty-state">
                        <span class="empty-icon">Aa</span>
                        <h2>Select a word</h2>
                    </div>
                </aside>
            </section>
        </main>
    </div>

    <dialog class="word-dialog" id="wordDialog" aria-labelledby="dialogTitle">
        <form id="wordForm">
            <div class="dialog-heading">
                <h2 id="dialogTitle">Add word</h2>
                <button class="icon-button" id="closeDialogButton" type="button" aria-label="Close">&times;</button>
            </div>

            <div class="form-grid">
                <label class="field span-2">
                    <span>Word or phrase *</span>
                    <input id="wordInput" name="word" type="text" required maxlength="120" placeholder="e.g. cumbersome">
                </label>
                <label class="field">
                    <span>Part of speech</span>
                    <select id="partOfSpeechInput" name="part_of_speech">
                        <option value="">Select...</option>
                        <option>Noun</option>
                        <option>Verb</option>
                        <option>Adjective</option>
                        <option>Adverb</option>
                        <option>Pronoun</option>
                        <option>Preposition</option>
                        <option>Conjunction</option>
                        <option>Interjection</option>
                        <option>Phrase</option>
                        <option>Idiom</option>
                        <option>Phrasal verb</option>
                    </select>
                </label>
                <label class="field">
                    <span>Pronunciation</span>
                    <input id="pronunciationInput" name="pronunciation" type="text" maxlength="120" placeholder="e.g. /ˈkʌmbəsəm/">
                </label>
                <label class="field">
                    <span>English meaning *</span>
                    <textarea id="meaningEnInput" name="meaning_en" required rows="3"></textarea>
                </label>
                <label class="field">
                    <span>Bahasa Indonesia</span>
                    <textarea id="meaningIdInput" name="meaning_id" rows="3"></textarea>
                </label>
                <label class="field">
                    <span>Learning status</span>
                    <select id="masteryInput" name="mastery_level">
                        <option>New</option>
                        <option>Learning</option>
                        <option>Familiar</option>
                        <option>Mastered</option>
                    </select>
                </label>
                <label class="check-field">
                    <input id="favoriteInput" name="favorite" type="checkbox">
                    <span>Favorite</span>
                </label>
                <label class="field span-2">
                    <span>Notes</span>
                    <textarea id="notesInput" name="notes" rows="2"></textarea>
                </label>
            </div>

            <div class="examples-section">
                <div class="section-heading">
                    <h3>Examples</h3>
                    <button class="secondary-button small" id="addExampleButton" type="button">+ Add example</button>
                </div>
                <div id="examplesEditor"></div>
            </div>

            <p class="form-message" id="formMessage" role="alert"></p>
            <div class="dialog-actions">
                <button class="secondary-button" id="cancelDialogButton" type="button">Cancel</button>
                <button class="primary-button" id="saveWordButton" type="submit">Save word</button>
            </div>
        </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260913-2"></script>
    <script src="js/dictionary.js?v=20260913-2"></script>
</body>
</html>
