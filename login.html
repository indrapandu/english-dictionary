<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#315c4f">
    <meta name="description" content="Sign in to My Dictionary.">
    <title>Log in | My Dictionary</title>
    <link rel="stylesheet" href="css/style.css?v=20260913-2">
</head>
<body class="login-page">
    <main class="login-layout">
        <div class="login-container">
            <a class="brand" href="index.html">
                <span class="brand-mark">M</span>
                <strong>My Dictionary</strong>
            </a>
            <form class="login-card" id="loginForm">
                <h1>Log in</h1>
                <label class="field">
                    <span>Email address</span>
                    <input id="emailInput" name="email" type="email" required autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com">
                </label>
                <label class="field">
                    <span>Password</span>
                    <input id="passwordInput" name="password" type="password" required autocomplete="current-password">
                </label>

                <p class="form-message" id="loginMessage" role="alert"></p>
                <button class="primary-button full-width" id="loginButton" type="submit">Log in</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js?v=20260913-2"></script>
</body>
</html>
